# Personalized `_config.yml` for Your Academic Website

```yml
# Basic Site Settings
locale                   : "en-US"
site_theme               : "default"
title                    : "Amirreza Fateh"
title_separator          : "-"
name                     : &name "Amirreza Fateh"
description              : &description "Academic portfolio of Amirreza Fateh, PhD candidate in Computer Engineering specializing in computer vision, few-shot learning, and medical imaging."
url                      : "https://YOUR_USERNAME.github.io"
baseurl                  : ""
repository               : "YOUR_USERNAME/YOUR_REPOSITORY"

# Site Author
author:
  # Biographic information
  avatar           : "profile.png"
  name             : "Amirreza Fateh"
  pronouns         :
  bio              : "PhD candidate in Computer Engineering working on computer vision, few-shot learning, and medical imaging."
  location         : "Tehran, Iran"
  employer         : "Iran University of Science and Technology"
  uri              :
  email            : "amirreza_fateh@comp.iust.ac.ir"

  # Academic websites
  academia         :
  arxiv            :
  googlescholar    : "https://scholar.google.com/citations?user=wjNokn4AAAAJ&hl=en"
  inspire-hep      :
  impactstory      :
  orcid            : "https://orcid.org/0000-0001-9894-9131"
  semantic         :
  ssrn             :
  pubmed           :
  researchgate     :
  scopus           :
  zotero           :

  # Repositories and software development
  bitbucket        :
  codepen          :
  dribbble         :
  github           : "YOUR_GITHUB_USERNAME"
  kaggle           :
  stackoverflow    :

  # Social media
  artstation       :
  bluesky          :
  facebook         :
  flickr           :
  foursquare       :
  goodreads        :
  google_plus      :
  keybase          :
  instagram        :
  lastfm           :
  linkedin         : "amirreza-fateh"
  mastodon         :
  medium           :
  pinterest        :
  soundcloud       :
  steam            :
  telegram         :
  tumblr           :
  twitter          :
  vine             :
  weibo            :
  wikipedia        :
  xing             :
  youtube          :
  zhihu            :

# Publication Categories
publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Journal Articles'
  conferences:
    title: 'Conference Papers'

# Site Settings
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false

# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Social Sharing
twitter:
  username               :
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 :
og_description           :

social:
  type                   : "Person"
  name                   : "Amirreza Fateh"
  links:
    - "https://scholar.google.com/citations?user=wjNokn4AAAAJ&hl=en"
    - "https://orcid.org/0000-0001-9894-9131"
    - "https://linkedin.com/in/amirreza-fateh"

# Analytics
analytics:
  provider               : false
  google:
    tracking_id          :

# Reading Files
include:
  - .htaccess
  - _pages
  - files

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Asia/Tehran

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Archives
category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
```

## Things You Still Need to Update

* Replace `YOUR_USERNAME` with your GitHub username.
* Replace `YOUR_REPOSITORY` with your repository name.
* Add your GitHub username in the `github` field.
* Add ResearchGate, Scopus, arXiv, or Twitter links if you use them.
* Put your personal photo inside `/images/profile.png`.
* If you buy a custom domain later, replace the `url` field with your domain.
